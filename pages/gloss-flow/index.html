<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gloss & Flow — סטודיו ציפורניים</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold:         '#D4AF37',
            'gold-light': '#EDD95A',
            'gold-dark':  '#B8960C',
            cream:        '#FAF7F2',
            'cream-dark': '#F0EAE0',
            nude:         '#E8D5C4',
            'nude-dark':  '#D4B896',
            'nude-darker':'#BFA080',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans:  ['Heebo', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; direction: rtl; }
    body { background-color: #FAF7F2; font-family: 'Heebo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .gold-gradient  { background: linear-gradient(135deg, #D4AF37 0%, #EDD95A 50%, #B8960C 100%); }
    .nude-gradient  { background: linear-gradient(135deg, #E8D5C4 0%, #D4B896 100%); }

    .slot-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .slot-btn:disabled span.slot-label { text-decoration: line-through; }

    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    input[type="date"] { color-scheme: light; direction: ltr; text-align: right; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .bottom-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease forwards; }

    @keyframes checkPop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .check-pop { animation: checkPop 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #D4AF37 25%, #EDD95A 50%, #D4AF37 75%);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ─────────────────────────────  DATA  ────────────────────────────────────── */

const SERVICES = [
  { id: 'gel-mani',  name: "ג'ל מניקור",           duration: 90,  price: 150, emoji: '💅', desc: 'צבע עמיד עם ברק מראה' },
  { id: 'classic',   name: 'מניקור קלאסי',          duration: 60,  price: 90,  emoji: '✨', desc: 'גימור נקי ואלגנטי' },
  { id: 'pedicure',  name: 'פדיקור',                duration: 60,  price: 120, emoji: '🌸', desc: 'טיפול מפנק לכפות הרגליים' },
  { id: 'gel-pedi',  name: "ג'ל פדיקור",            duration: 90,  price: 170, emoji: '🌿', desc: "פדיקור עמיד ג'ל פרימיום" },
  { id: 'nail-art',  name: 'ציפורניים אמנותיות',   duration: 120, price: 200, emoji: '🎨', desc: 'עיצובים אמנותיים מותאמים אישית' },
  { id: 'acrylic',   name: 'אקריליק',               duration: 120, price: 220, emoji: '💎', desc: 'סט מלא ציפורניים מגולפות' },
  { id: 'mani-pedi', name: 'קומבו מניקור + פדיקור', duration: 150, price: 240, emoji: '👑', desc: 'טיפול מלא לידיים ולרגליים' },
];

const TIME_SLOTS = [
  '09:00','09:30','10:00','10:30','11:00','11:30',
  '12:00','12:30','13:00','13:30','14:00','14:30',
  '15:00','15:30','16:00','16:30','17:00','17:30',
  '18:00','18:30','19:00','19:30','20:00',
];

const STATUS_META = {
  pending:   { label: 'ממתין לאישור', cls: 'bg-amber-50  text-amber-700  border-amber-200'  },
  confirmed: { label: 'מאושר',        cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
  completed: { label: 'הושלם',        cls: 'bg-slate-50  text-slate-500  border-slate-200'  },
  cancelled: { label: 'בוטל',         cls: 'bg-red-50    text-red-500    border-red-200'    },
};

const LS_KEY     = 'glossflow_v1_appointments';
const ADMIN_PASS = 'admin123';

/* ─────────────────────────────  HELPERS  ─────────────────────────────────── */

const loadAppts = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } };
const saveAppts = a  => localStorage.setItem(LS_KEY, JSON.stringify(a));
const genId     = () => Math.random().toString(36).slice(2,9).toUpperCase();
const todayStr  = () => new Date().toISOString().split('T')[0];
const fmtDate   = s  => { if (!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtLong   = s  => {
  if (!s) return '';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
};

/* ──────────────────────────────  ICONS  ──────────────────────────────────── */

const ICON_PATHS = {
  calendar:     <><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
  clock:        <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  phone:        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.46a2 2 0 0 1 1.98-2.17h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.12a16 16 0 0 0 6 6l1.9-1.9a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>,
  check:        <polyline points="20 6 9 17 4 12"/>,
  x:            <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
  shield:       <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
  list:         <><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></>,
  chevronRight: <path d="m9 18 6-6-6-6"/>,
  chevronLeft:  <path d="m15 18-6-6 6-6"/>,
  arrowLeft:    <><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>,
  sparkles:     <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>,
  user:         <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
  lock:         <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
  unlock:       <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>,
  info:         <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
  search:       <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></>,
};

function Ic({ n, size = 20, cls = '' }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth="1.8"
      strokeLinecap="round" strokeLinejoin="round" className={cls}>
      {ICON_PATHS[n]}
    </svg>
  );
}

/* ─────────────────────────────  UI ATOMS  ────────────────────────────────── */

function GoldBtn({ children, onClick, disabled, small, outline, className = '' }) {
  const base = `font-sans font-semibold transition-all duration-200 flex items-center justify-center gap-2 rounded-2xl`;
  const size = small ? 'px-4 py-2.5 text-xs' : 'w-full py-4 text-sm';
  const variant = outline
    ? 'border-2 border-gold text-gold-dark hover:bg-gold/5 bg-transparent'
    : 'gold-gradient text-white shadow-md hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed';
  return (
    <button onClick={onClick} disabled={disabled} className={`${base} ${size} ${variant} ${className}`}>
      {children}
    </button>
  );
}

function StatusBadge({ status }) {
  const m = STATUS_META[status] || STATUS_META.pending;
  return <span className={`text-[11px] font-sans font-medium px-2.5 py-1 rounded-full border ${m.cls}`}>{m.label}</span>;
}

/* ──────────────────────────────  HEADER  ─────────────────────────────────── */

function Header({ adminUnlocked, onAdminToggle }) {
  return (
    <header className="sticky top-0 z-40 bg-cream/95 backdrop-blur-md border-b border-nude/60">
      <div className="max-w-lg mx-auto flex items-center justify-between px-4 py-3">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-full gold-gradient flex items-center justify-center shadow-sm">
            <Ic n="sparkles" size={15} cls="text-white" />
          </div>
          <div>
            <p className="font-serif text-[18px] font-semibold text-stone-800 leading-none">Gloss & Flow</p>
            <p className="text-[9px] tracking-[0.15em] text-nude-darker uppercase font-sans mt-0.5">סטודיו ציפורניים</p>
          </div>
        </div>
        <button
          onClick={onAdminToggle}
          className={`flex items-center gap-1.5 text-[11px] font-sans px-3 py-1.5 rounded-full border transition-all ${
            adminUnlocked
              ? 'bg-gold/10 border-gold/60 text-gold-dark'
              : 'border-stone-200 text-stone-400 hover:border-nude-dark'
          }`}
        >
          <Ic n={adminUnlocked ? 'unlock' : 'lock'} size={11} />
          {adminUnlocked ? 'מנהל פעיל' : 'מנהל'}
        </button>
      </div>
    </header>
  );
}

/* ─────────────────────────────  BOTTOM NAV  ──────────────────────────────── */

function BottomNav({ activeTab, onTabChange, adminUnlocked }) {
  const tabs = [
    { id: 'book',  label: 'הזמנה',    icon: 'sparkles' },
    { id: 'my',    label: 'הביקורים שלי', icon: 'user' },
    ...(adminUnlocked ? [{ id: 'admin', label: 'לוח בקרה', icon: 'shield' }] : []),
  ];
  return (
    <nav className="fixed bottom-0 inset-x-0 z-40 bg-cream/95 backdrop-blur-md border-t border-nude/60 bottom-safe">
      <div className="max-w-lg mx-auto flex pb-1">
        {tabs.map(t => (
          <button
            key={t.id}
            onClick={() => onTabChange(t.id)}
            className={`flex-1 flex flex-col items-center pt-2.5 pb-1 gap-1 transition-all ${
              activeTab === t.id ? 'text-gold-dark' : 'text-stone-400 hover:text-stone-600'
            }`}
          >
            <Ic n={t.icon} size={21} />
            <span className="text-[10px] font-sans font-medium">{t.label}</span>
            <div className={`w-1 h-1 rounded-full transition-all ${activeTab === t.id ? 'bg-gold' : 'bg-transparent'}`} />
          </button>
        ))}
      </div>
    </nav>
  );
}

/* ─────────────────────────────  SERVICE CARD  ────────────────────────────── */

function ServiceCard({ svc, selected, onSelect }) {
  return (
    <button
      onClick={() => onSelect(svc)}
      className={`w-full text-right p-4 rounded-2xl border-2 transition-all duration-200 active:scale-[0.98] ${
        selected ? 'border-gold bg-gold/5 shadow-sm' : 'border-nude/70 bg-white hover:border-nude-dark'
      }`}
    >
      <div className="flex items-start justify-between gap-3">
        <div className="text-left shrink-0">
          <p className="font-serif text-gold-dark font-semibold text-[17px]">₪{svc.price}</p>
          <div className={`w-5 h-5 rounded-full mt-2 mr-auto flex items-center justify-center transition-all ${
            selected ? 'gold-gradient' : 'border-2 border-nude'
          }`}>
            {selected && <Ic n="check" size={11} cls="text-white" />}
          </div>
        </div>
        <div className="flex items-start gap-3 flex-1">
          <div className="flex-1">
            <p className="font-sans text-stone-800 font-semibold text-[15px]">{svc.name}</p>
            <p className="text-stone-400 text-xs font-sans mt-0.5 leading-snug">{svc.desc}</p>
            <span className="inline-flex items-center gap-1 mt-1.5 text-[11px] text-stone-400 font-sans">
              <Ic n="clock" size={11} /> {svc.duration} דק׳
            </span>
          </div>
          <span className="text-[26px] leading-none mt-0.5">{svc.emoji}</span>
        </div>
      </div>
    </button>
  );
}

/* ──────────────────────────  TIME SLOT GRID  ─────────────────────────────── */

function TimeSlotGrid({ slots, taken, selected, onSelect }) {
  return (
    <div className="grid grid-cols-4 gap-2">
      {slots.map(slot => {
        const isTaken  = taken.includes(slot);
        const isActive = selected === slot;
        return (
          <button
            key={slot}
            disabled={isTaken}
            onClick={() => !isTaken && onSelect(slot)}
            className={`slot-btn py-3 rounded-xl text-center border transition-all duration-150 active:scale-95 ${
              isTaken
                ? 'bg-stone-50 border-stone-100 cursor-not-allowed'
                : isActive
                ? 'gold-gradient border-transparent shadow-sm'
                : 'bg-white border-nude/70 hover:border-gold'
            }`}
          >
            <span className={`slot-label block text-xs font-sans font-medium ${
              isTaken ? 'text-stone-300' : isActive ? 'text-white' : 'text-stone-600'
            }`}>{slot}</span>
            {isTaken && <span className="block text-[9px] text-stone-300 mt-0.5">תפוס</span>}
          </button>
        );
      })}
    </div>
  );
}

/* ─────────────────────────  APPOINTMENT CARD  ────────────────────────────── */

function AppointmentCard({ appt, onStatusChange, isAdmin }) {
  const svc = SERVICES.find(s => s.id === appt.serviceId);
  const nexts = { pending: ['confirmed','cancelled'], confirmed: ['completed','cancelled'], completed: [], cancelled: [] };
  const available = nexts[appt.status] || [];

  const actionMeta = {
    confirmed: { label: '✓ אשרי',    cls: 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100' },
    completed: { label: '★ הושלם',   cls: 'bg-slate-50   border-slate-200   text-slate-600   hover:bg-slate-100'   },
    cancelled: { label: '✕ בטלי',    cls: 'bg-red-50     border-red-200     text-red-500     hover:bg-red-100'     },
  };

  return (
    <div className="bg-white rounded-2xl border border-nude/60 p-4 shadow-sm fade-up">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="text-left shrink-0">
          <StatusBadge status={appt.status} />
          <p className="text-gold-dark font-serif font-semibold text-[15px] mt-1.5">₪{svc?.price ?? appt.price}</p>
        </div>
        <div className="flex items-start gap-2.5 flex-1 justify-end">
          <div className="text-right">
            <p className="font-sans text-stone-800 font-semibold text-[15px]">{svc?.name || appt.serviceName}</p>
            {isAdmin && (
              <p className="text-xs text-stone-400 font-sans mt-0.5">
                {appt.clientName} &middot; {appt.clientPhone}
              </p>
            )}
          </div>
          <span className="text-xl mt-0.5">{svc?.emoji || '💅'}</span>
        </div>
      </div>

      <div className="flex items-center gap-4 text-xs text-stone-400 font-sans justify-end mb-1">
        <span className="flex items-center gap-1">{svc?.duration ?? appt.duration} דק׳ <Ic n="clock" size={11}/></span>
        <span className="flex items-center gap-1">{appt.time} <Ic n="clock" size={11}/></span>
        <span className="flex items-center gap-1">{fmtDate(appt.date)} <Ic n="calendar" size={11}/></span>
      </div>

      {appt.notes && (
        <p className="text-xs text-stone-400 font-sans pr-8 mt-1 italic text-right">״{appt.notes}״</p>
      )}

      {isAdmin && available.length > 0 && (
        <div className="flex gap-2 mt-3 pt-3 border-t border-nude/40">
          {available.map(s => (
            <button
              key={s}
              onClick={() => onStatusChange(appt.id, s)}
              className={`flex-1 py-2 rounded-xl text-xs font-sans font-medium border transition-all ${actionMeta[s].cls}`}
            >
              {actionMeta[s].label}
            </button>
          ))}
        </div>
      )}

      <p className="text-[10px] text-stone-200 font-sans mt-2 text-left">#{appt.id}</p>
    </div>
  );
}

/* ──────────────────────────  ADMIN LOGIN MODAL  ──────────────────────────── */

function AdminModal({ onClose, onSuccess }) {
  const [pass, setPass] = useState('');
  const [err, setErr]   = useState(false);
  const inp = useRef();

  useEffect(() => { setTimeout(() => inp.current?.focus(), 100); }, []);

  function submit(e) {
    e.preventDefault();
    if (pass === ADMIN_PASS) { onSuccess(); onClose(); }
    else { setErr(true); setPass(''); setTimeout(() => setErr(false), 1800); }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-stone-900/40 backdrop-blur-sm"
      onClick={onClose}>
      <div className="w-full max-w-lg bg-cream rounded-t-3xl px-6 pt-5 pb-10 shadow-2xl fade-up"
        onClick={e => e.stopPropagation()}>
        <div className="w-10 h-1 rounded-full bg-nude mx-auto mb-6" />
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-full gold-gradient flex items-center justify-center mx-auto mb-3 shadow-md">
            <Ic n="shield" size={24} cls="text-white" />
          </div>
          <h3 className="font-sans text-xl font-bold text-stone-800">כניסת מנהל</h3>
          <p className="text-stone-400 text-sm font-sans mt-1">הכניסי סיסמת מנהל להמשך</p>
        </div>
        <form onSubmit={submit}>
          <input
            ref={inp}
            type="password"
            value={pass}
            onChange={e => setPass(e.target.value)}
            placeholder="סיסמה"
            dir="ltr"
            className={`w-full bg-white border-2 rounded-2xl px-4 py-3.5 text-stone-800 font-sans text-sm outline-none transition-all text-center ${
              err ? 'border-red-300' : 'border-nude focus:border-gold'
            }`}
          />
          {err && <p className="text-red-400 text-xs font-sans mt-2 text-center">סיסמה שגויה. נסי שוב.</p>}
          <GoldBtn className="mt-4">
            <Ic n="unlock" size={15} /> פתחי לוח בקרה
          </GoldBtn>
        </form>
        <p className="text-center text-stone-300 text-[11px] font-sans mt-3" dir="ltr">Hint: admin123</p>
      </div>
    </div>
  );
}

/* ──────────────────────────────  BOOK SCREEN  ────────────────────────────── */

function BookScreen({ appointments, onBook }) {
  const [step, setStep]   = useState(1);
  const [svc, setSvc]     = useState(null);
  const [date, setDate]   = useState('');
  const [time, setTime]   = useState('');
  const [name, setName]   = useState('');
  const [phone, setPhone] = useState('');
  const [notes, setNotes] = useState('');
  const [booked, setBooked] = useState(null);

  const min = todayStr();

  const takenSlots = useMemo(() => {
    if (!date) return [];
    return appointments
      .filter(a => a.date === date && a.status !== 'cancelled')
      .map(a => a.time);
  }, [appointments, date]);

  function handleBook() {
    const appt = {
      id: genId(),
      serviceId: svc.id, serviceName: svc.name, price: svc.price, duration: svc.duration,
      date, time, clientName: name, clientPhone: phone, notes,
      status: 'pending', createdAt: new Date().toISOString(),
    };
    onBook(appt);
    setBooked(appt);
    setStep(5);
  }

  function reset() {
    setStep(1); setSvc(null); setDate(''); setTime('');
    setName(''); setPhone(''); setNotes(''); setBooked(null);
  }

  /* ── מסך הצלחה ── */
  if (step === 5 && booked) {
    return (
      <div className="flex flex-col items-center px-6 pt-12 pb-28 text-center fade-up">
        <div className="w-24 h-24 rounded-full gold-gradient flex items-center justify-center mb-6 shadow-xl">
          <Ic n="check" size={40} cls="text-white check-pop" />
        </div>
        <h2 className="font-sans text-2xl font-bold text-stone-800 mb-1">!הכל מוכן</h2>
        <p className="text-stone-500 font-sans text-sm">{svc?.name}</p>
        <p className="text-stone-400 font-sans text-xs mt-1">{fmtLong(date)} בשעה {time}</p>

        <div className="w-full max-w-xs bg-white rounded-2xl border border-nude/60 p-4 mt-6 shadow-sm">
          {[
            ['שירות',  svc?.name],
            ['שם',     name],
            ['טלפון',  phone],
            ['תאריך',  fmtDate(date)],
            ['שעה',    time],
            ["משך",    `${svc?.duration} דק׳`],
          ].map(([k,v]) => (
            <div key={k} className="flex justify-between py-1.5 border-b border-nude/30 last:border-0">
              <span className="text-xs text-stone-700 font-sans font-medium">{v}</span>
              <span className="text-xs text-stone-400 font-sans">{k}</span>
            </div>
          ))}
          <div className="flex justify-between pt-2.5 mt-1">
            <span className="text-[17px] text-gold-dark font-serif font-semibold">₪{svc?.price}</span>
            <span className="text-sm text-stone-600 font-sans font-medium">סה״כ</span>
          </div>
        </div>

        <div className="mt-4 w-full max-w-xs bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-center gap-2.5">
          <p className="text-xs text-amber-700 font-sans text-right flex-1">ההזמנה שלך <strong>ממתינה לאישור</strong> — ניצור קשר בקרוב!</p>
          <Ic n="info" size={15} cls="text-amber-500 shrink-0" />
        </div>

        <div className="w-full max-w-xs mt-6">
          <GoldBtn onClick={reset}>הזמני שוב</GoldBtn>
        </div>
      </div>
    );
  }

  const stepLabels = ['שירות', 'תאריך ושעה', 'פרטים'];

  return (
    <div className="pb-28 max-w-lg mx-auto">
      {/* Hero Banner */}
      {step === 1 && (
        <div className="relative overflow-hidden px-5 pt-7 pb-6 bg-gradient-to-bl from-nude/60 via-cream to-cream">
          <div className="absolute top-0 left-0 w-32 h-32 rounded-full bg-gold/8 -translate-y-8 -translate-x-8" />
          <div className="absolute bottom-0 right-0 w-20 h-20 rounded-full bg-nude translate-y-8 translate-x-5 opacity-60" />
          <p className="text-[10px] uppercase tracking-[0.25em] text-nude-darker font-sans mb-1 relative">ברוכה הבאה ל</p>
          <h2 className="font-serif text-[32px] font-medium text-stone-800 leading-tight relative">
            Gloss & Flow<br/>
            <span className="text-[22px]">סטודיו ציפורניים</span>
          </h2>
          <p className="text-stone-400 text-sm font-sans mt-2 relative">בחרי שירות כדי להתחיל</p>
        </div>
      )}

      <div className="px-4 pt-5">
        {/* Progress */}
        <div className="flex items-center gap-2 mb-6">
          {stepLabels.map((label, i) => {
            const s = i + 1;
            const done = step > s;
            const active = step === s;
            return (
              <React.Fragment key={s}>
                <div className="flex items-center gap-1.5 shrink-0">
                  <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold font-sans transition-all ${
                    done ? 'gold-gradient text-white' : active ? 'border-2 border-gold text-gold-dark' : 'border-2 border-nude text-stone-300'
                  }`}>
                    {done ? <Ic n="check" size={11} cls="text-white" /> : s}
                  </div>
                  <span className={`text-[10px] font-sans hidden sm:block ${active ? 'text-stone-600' : 'text-stone-300'}`}>{label}</span>
                </div>
                {i < stepLabels.length - 1 && (
                  <div className={`flex-1 h-px transition-all ${done ? 'bg-gold' : 'bg-nude/60'}`} />
                )}
              </React.Fragment>
            );
          })}
        </div>

        {/* ── שלב 1: שירות ── */}
        {step === 1 && (
          <div className="fade-up">
            <h3 className="font-sans text-xl font-bold text-stone-800 mb-4">בחרי שירות</h3>
            <div className="flex flex-col gap-3">
              {SERVICES.map(s => (
                <ServiceCard key={s.id} svc={s} selected={svc?.id === s.id} onSelect={setSvc} />
              ))}
            </div>
            {svc && (
              <div className="mt-6">
                <GoldBtn onClick={() => setStep(2)}>
                  <Ic n="arrowLeft" size={16} /> המשך
                </GoldBtn>
              </div>
            )}
          </div>
        )}

        {/* ── שלב 2: תאריך ושעה ── */}
        {step === 2 && (
          <div className="fade-up">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 text-stone-400 text-sm font-sans mb-4 hover:text-stone-600 transition-colors">
              חזרה <Ic n="chevronRight" size={16} />
            </button>
            <h3 className="font-sans text-xl font-bold text-stone-800 mb-1">בחרי תאריך ושעה</h3>
            <p className="text-stone-400 text-xs font-sans mb-5 flex items-center gap-2 justify-end">
              ₪{svc?.price} &middot; {svc?.duration} דק׳ &middot; {svc?.name}
              <span className="text-base">{svc?.emoji}</span>
            </p>

            <label className="block text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-2 text-right">בחרי תאריך</label>
            <input
              type="date"
              min={min}
              value={date}
              onChange={e => { setDate(e.target.value); setTime(''); }}
              className="w-full bg-white border-2 border-nude rounded-2xl px-4 py-3.5 text-stone-800 font-sans text-sm outline-none focus:border-gold transition-all mb-6"
            />

            {date && (
              <div className="fade-up">
                <div className="flex items-center justify-between mb-2">
                  {takenSlots.length > 0 && (
                    <span className="text-[10px] text-stone-300 font-sans flex items-center gap-1">
                      <Ic n="info" size={10} /> {takenSlots.length} שעות תפוסות
                    </span>
                  )}
                  <label className="block text-[10px] uppercase tracking-widest text-stone-400 font-sans">שעות פנויות</label>
                </div>
                <TimeSlotGrid slots={TIME_SLOTS} taken={takenSlots} selected={time} onSelect={setTime} />
              </div>
            )}

            {date && time && (
              <div className="mt-6">
                <GoldBtn onClick={() => setStep(3)}>
                  <Ic n="arrowLeft" size={16} /> המשך
                </GoldBtn>
              </div>
            )}
          </div>
        )}

        {/* ── שלב 3: פרטי לקוחה ── */}
        {step === 3 && (
          <div className="fade-up">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 text-stone-400 text-sm font-sans mb-4 hover:text-stone-600 transition-colors">
              חזרה <Ic n="chevronRight" size={16} />
            </button>
            <h3 className="font-sans text-xl font-bold text-stone-800 mb-1">הפרטים שלך</h3>
            <p className="text-stone-400 text-xs font-sans mb-5 text-right">
              {fmtDate(date)} בשעה {time}
            </p>

            <div className="flex flex-col gap-4">
              <div>
                <label className="block text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-2 text-right">שם מלא *</label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="שמך המלא"
                  className="w-full bg-white border-2 border-nude rounded-2xl px-4 py-3.5 text-stone-800 font-sans text-sm outline-none focus:border-gold transition-all text-right"
                />
              </div>
              <div>
                <label className="block text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-2 text-right">מספר טלפון *</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={e => setPhone(e.target.value)}
                  placeholder="050-000-0000"
                  dir="ltr"
                  className="w-full bg-white border-2 border-nude rounded-2xl px-4 py-3.5 text-stone-800 font-sans text-sm outline-none focus:border-gold transition-all text-center"
                />
              </div>
              <div>
                <label className="block text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-2 text-right">
                  הערות <span className="normal-case tracking-normal text-stone-300">(אופציונלי)</span>
                </label>
                <textarea
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  placeholder="אלרגיות, העדפות צבע, בקשות מיוחדות..."
                  rows={3}
                  className="w-full bg-white border-2 border-nude rounded-2xl px-4 py-3 text-stone-800 font-sans text-sm outline-none focus:border-gold transition-all resize-none text-right"
                />
              </div>
            </div>

            {/* כרטיס סיכום */}
            <div className="mt-5 bg-white rounded-2xl border border-nude/60 p-4 shadow-sm">
              <p className="font-sans text-stone-700 font-semibold text-sm mb-3 text-right">סיכום הזמנה</p>
              <div className="space-y-2">
                {[
                  ['שירות',  svc?.name],
                  ['תאריך',  fmtDate(date)],
                  ['שעה',    time],
                  ['משך',    `${svc?.duration} דק׳`],
                ].map(([k,v]) => (
                  <div key={k} className="flex justify-between text-sm font-sans">
                    <span className="text-stone-700 font-medium">{v}</span>
                    <span className="text-stone-400">{k}</span>
                  </div>
                ))}
                <div className="flex justify-between pt-2 border-t border-nude/40 mt-1">
                  <span className="text-gold-dark font-serif font-bold text-[17px]">₪{svc?.price}</span>
                  <span className="text-stone-600 font-sans font-semibold text-sm">סה״כ</span>
                </div>
              </div>
            </div>

            <div className="mt-6">
              <GoldBtn
                disabled={!name.trim() || !phone.trim()}
                onClick={handleBook}
              >
                <Ic n="sparkles" size={16} /> אשרי הזמנה
              </GoldBtn>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ────────────────────────────  MY SCREEN  ────────────────────────────────── */

function MyScreen({ appointments }) {
  const [phone, setPhone]     = useState('');
  const [searched, setSearched] = useState(false);

  const myAppts = useMemo(() => {
    if (!phone.trim() || !searched) return [];
    const norm = phone.replace(/[\s\-()]/g, '');
    return appointments
      .filter(a => a.clientPhone.replace(/[\s\-()]/g, '').includes(norm))
      .sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  }, [appointments, phone, searched]);

  const upcoming = myAppts.filter(a => !['completed','cancelled'].includes(a.status) && a.date >= todayStr());
  const past     = myAppts.filter(a => ['completed','cancelled'].includes(a.status) || a.date < todayStr());

  function handleSearch(e) { e.preventDefault(); setSearched(true); }

  return (
    <div className="pb-28 px-4 pt-6 max-w-lg mx-auto">
      <h2 className="font-sans text-2xl font-bold text-stone-800 mb-1 text-right">ההזמנות שלי</h2>
      <p className="text-stone-400 text-sm font-sans mb-6 text-right">הכניסי מספר טלפון לצפייה בהזמנות</p>

      <form onSubmit={handleSearch} className="flex gap-2 mb-6 flex-row-reverse">
        <div className="flex-1 relative">
          <Ic n="phone" size={15} cls="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-300 pointer-events-none" />
          <input
            type="tel"
            value={phone}
            onChange={e => { setPhone(e.target.value); setSearched(false); }}
            placeholder="050-000-0000"
            dir="ltr"
            className="w-full bg-white border-2 border-nude rounded-2xl pr-9 pl-4 py-3.5 text-stone-800 font-sans text-sm outline-none focus:border-gold transition-all text-center"
          />
        </div>
        <GoldBtn small disabled={!phone.trim()} className="px-5 py-3.5 rounded-2xl">
          <Ic n="search" size={15} />
        </GoldBtn>
      </form>

      {searched && phone.trim() && myAppts.length === 0 && (
        <div className="text-center py-14 fade-up">
          <div className="w-16 h-16 rounded-full nude-gradient flex items-center justify-center mx-auto mb-4">
            <Ic n="calendar" size={24} cls="text-nude-darker" />
          </div>
          <p className="font-sans text-stone-600 text-lg font-bold">לא נמצאו הזמנות</p>
          <p className="text-stone-400 text-sm font-sans mt-1">אין הזמנות למספר זה</p>
        </div>
      )}

      {searched && myAppts.length > 0 && (
        <div className="fade-up">
          {upcoming.length > 0 && (
            <div className="mb-6">
              <p className="text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-3 text-right">קרובות ({upcoming.length})</p>
              <div className="flex flex-col gap-3">
                {upcoming.map(a => <AppointmentCard key={a.id} appt={a} isAdmin={false} />)}
              </div>
            </div>
          )}
          {past.length > 0 && (
            <div>
              <p className="text-[10px] uppercase tracking-widest text-stone-400 font-sans mb-3 text-right">היסטוריה ({past.length})</p>
              <div className="flex flex-col gap-3">
                {past.map(a => <AppointmentCard key={a.id} appt={a} isAdmin={false} />)}
              </div>
            </div>
          )}
          <p className="text-center text-stone-300 text-xs font-sans mt-5">
            {myAppts.length} הזמנות בסה״כ
          </p>
        </div>
      )}

      {!searched && (
        <div className="text-center py-14">
          <div className="w-20 h-20 rounded-full nude-gradient flex items-center justify-center mx-auto mb-5 shadow-sm">
            <Ic n="user" size={30} cls="text-nude-darker" />
          </div>
          <p className="font-sans text-stone-600 text-xl font-bold">מצאי את ההזמנות שלך</p>
          <p className="text-stone-400 text-sm font-sans mt-1.5">חפשי לפי מספר טלפון למעלה</p>
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────  ADMIN SCREEN  ─────────────────────────────── */

function AdminScreen({ appointments, onStatusChange }) {
  const [filter, setFilter]  = useState('all');
  const [dateFilter, setDateF] = useState('');

  const filtered = useMemo(() => {
    let list = [...appointments];
    if (filter !== 'all') list = list.filter(a => a.status === filter);
    if (dateFilter) list = list.filter(a => a.date === dateFilter);
    return list.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  }, [appointments, filter, dateFilter]);

  const today     = todayStr();
  const todayList = appointments.filter(a => a.date === today && a.status !== 'cancelled');
  const revenue   = appointments.filter(a => a.status === 'completed').reduce((s,a) => s + (a.price ?? 0), 0);
  const pending   = appointments.filter(a => a.status === 'pending').length;
  const confirmed = appointments.filter(a => a.status === 'confirmed').length;

  const filterBtns = [
    { val:'all',       label:'הכל',     count: appointments.length },
    { val:'pending',   label:'ממתין',   count: pending },
    { val:'confirmed', label:'מאושר',   count: confirmed },
    { val:'completed', label:'הושלם',   count: appointments.filter(a=>a.status==='completed').length },
    { val:'cancelled', label:'בוטל',    count: appointments.filter(a=>a.status==='cancelled').length },
  ];

  return (
    <div className="pb-28 pt-6 max-w-lg mx-auto">
      <div className="px-4">
        <div className="flex items-center justify-between mb-1">
          <span className="flex items-center gap-1.5 text-[11px] font-sans text-gold-dark bg-gold/10 px-2.5 py-1 rounded-full border border-gold/30">
            <Ic n="shield" size={11} /> מנהל
          </span>
          <h2 className="font-sans text-2xl font-bold text-stone-800">לוח בקרה</h2>
        </div>
        <p className="text-stone-400 text-sm font-sans mb-5 text-right">{fmtLong(today)}</p>

        {/* סטטיסטיקות */}
        <div className="grid grid-cols-3 gap-3 mb-6">
          <div className="bg-white rounded-2xl border border-nude/60 p-3.5 text-center shadow-sm">
            <p className="font-serif text-[28px] text-stone-800 leading-none">{todayList.length}</p>
            <p className="text-[10px] text-stone-400 font-sans mt-1">היום</p>
          </div>
          <div className="bg-white rounded-2xl border border-amber-200 p-3.5 text-center shadow-sm">
            <p className="font-serif text-[28px] text-amber-600 leading-none">{pending}</p>
            <p className="text-[10px] text-stone-400 font-sans mt-1">ממתין</p>
          </div>
          <div className="bg-white rounded-2xl border border-nude/60 p-3.5 text-center shadow-sm">
            <p className="font-serif text-[22px] text-gold-dark leading-none mt-1">₪{revenue}</p>
            <p className="text-[10px] text-stone-400 font-sans mt-1">הכנסה</p>
          </div>
        </div>
      </div>

      {/* סרגל סינון */}
      <div className="px-4 mb-2">
        <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-1 flex-row-reverse">
          {filterBtns.map(({ val, label, count }) => (
            <button
              key={val}
              onClick={() => setFilter(val)}
              className={`shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-sans font-medium border transition-all ${
                filter === val
                  ? 'gold-gradient text-white border-transparent shadow-sm'
                  : 'bg-white border-nude/70 text-stone-500 hover:border-nude-dark'
              }`}
            >
              <span className={`text-[10px] ${filter === val ? 'text-white/70' : 'text-stone-300'}`}>{count}</span>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* סינון לפי תאריך */}
      <div className="px-4 mb-5 flex items-center gap-2 flex-row-reverse">
        <Ic n="calendar" size={14} cls="text-stone-300" />
        <input
          type="date"
          value={dateFilter}
          onChange={e => setDateF(e.target.value)}
          className="bg-white border-2 border-nude rounded-xl px-3 py-2 text-stone-600 font-sans text-xs outline-none focus:border-gold transition-all"
        />
        {dateFilter && (
          <button onClick={() => setDateF('')} className="text-xs text-stone-400 font-sans hover:text-stone-600 transition-colors">
            נקה
          </button>
        )}
      </div>

      {/* רשימת הזמנות */}
      <div className="px-4 flex flex-col gap-3">
        {filtered.length === 0 ? (
          <div className="text-center py-14 fade-up">
            <div className="w-16 h-16 rounded-full nude-gradient flex items-center justify-center mx-auto mb-4">
              <Ic n="list" size={24} cls="text-nude-darker" />
            </div>
            <p className="font-sans text-stone-600 text-lg font-bold">אין הזמנות</p>
            <p className="text-stone-400 text-xs font-sans mt-1">נסי פילטר אחר</p>
          </div>
        ) : (
          filtered.map(a => (
            <AppointmentCard key={a.id} appt={a} onStatusChange={onStatusChange} isAdmin={true} />
          ))
        )}
      </div>
    </div>
  );
}

/* ────────────────────────────────  APP  ─────────────────────────────────── */

function App() {
  const [appointments, setAppts] = useState(() => loadAppts());
  const [tab, setTab]            = useState('book');
  const [adminOn, setAdminOn]    = useState(false);
  const [showModal, setModal]    = useState(false);

  useEffect(() => { saveAppts(appointments); }, [appointments]);

  function handleBook(appt) { setAppts(prev => [...prev, appt]); }
  function handleStatus(id, status) { setAppts(prev => prev.map(a => a.id === id ? { ...a, status } : a)); }
  function toggleAdmin() {
    if (adminOn) { setAdminOn(false); if (tab === 'admin') setTab('book'); }
    else setModal(true);
  }

  return (
    <div className="min-h-screen bg-cream">
      <Header adminUnlocked={adminOn} onAdminToggle={toggleAdmin} />
      <main className="max-w-lg mx-auto">
        {tab === 'book'  && <BookScreen  appointments={appointments} onBook={handleBook} />}
        {tab === 'my'    && <MyScreen    appointments={appointments} />}
        {tab === 'admin' && adminOn && <AdminScreen appointments={appointments} onStatusChange={handleStatus} />}
      </main>
      <BottomNav activeTab={tab} onTabChange={setTab} adminUnlocked={adminOn} />
      {showModal && (
        <AdminModal
          onClose={() => setModal(false)}
          onSuccess={() => { setAdminOn(true); setTab('admin'); setModal(false); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
