let _ctx=null;
const getCtx=()=>{if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();return _ctx;};
function tone(freq,start,dur,vol=.18,type='triangle'){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.start(start);o.stop(start+dur+.02);}catch{}
}

  try{const c=getCtx(),dur=1.1,buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=c.createBufferSource();src.buffer=buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.7;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;const g=c.createGain(),t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.52,t+.03);g.gain.setValueAtTime(.42,t+.09);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur);}catch{}
}

/* ══ SOUNDCLOUD PLAYER ══ */
let _scInited=false,_scWidgets=[],_scReady=[],_scDurations=[],_scCurrent=-1,_scIsPlaying=false,_scProgress=0;
function initSC(){
  if(_scInited)return;_scInited=true;
  const s=document.createElement('script');
  s.src='https://w.soundcloud.com/player/api.js';
  s.onload=()=>{
    const c=document.getElementById('sc-players');if(!c)return;
    SC_TRACKS.forEach((t,i)=>{
      const f=document.createElement('iframe');
      f.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(t.url)+'&auto_play=false&hide_related=true&show_comments=false&show_reposts=false&visual=false&buying=false&liking=false&download=false&sharing=false';
      f.width='1';f.height='1';f.frameBorder='0';f.scrolling='no';
      c.appendChild(f);
      const w=SC.Widget(f);_scWidgets[i]=w;
      w.bind(SC.Widget.Events.READY,()=>{
        _scReady[i]=true;
        w.getDuration(d=>{_scDurations[i]=d||0;});
      });
      w.bind(SC.Widget.Events.PLAY_PROGRESS,data=>{
        if(i===_scCurrent)_scProgress=data.relativePosition||0;
      });
      w.bind(SC.Widget.Events.FINISH,()=>{if(i===_scCurrent&&_scIsPlaying){w.seekTo(0);w.play();}});
    });
  };
  document.head.appendChild(s);
}
function scPlay(idx){
  if(_scCurrent!==idx&&_scCurrent!==-1)_scWidgets[_scCurrent]?.pause();
  _scCurrent=idx;_scIsPlaying=true;_scProgress=0;
  const w=_scWidgets[idx];
  if(w){w.seekTo(0);w.play();if(!_scDurations[idx])w.getDuration(d=>{_scDurations[idx]=d||0;});}
}
function scPause(){_scIsPlaying=false;if(_scCurrent!==-1)_scWidgets[_scCurrent]?.pause();}
function scStop(){
  _scIsPlaying=false;_scProgress=0;
  if(_scCurrent!==-1){_scWidgets[_scCurrent]?.pause();try{_scWidgets[_scCurrent]?.seekTo(0);}catch{}_scCurrent=-1;}
}
function scSeek(frac){
  if(_scCurrent===-1)return;_scProgress=frac;
  const dur=_scDurations[_scCurrent];
  if(dur&&_scWidgets[_scCurrent])_scWidgets[_scCurrent].seekTo(Math.floor(frac*dur));
}
function scSetVol(v){_scWidgets.forEach(w=>w?.setVolume(Math.round(v*100)));}
function scGetProgress(){return _scProgress;}
function scGetDuration(idx){return _scDurations[idx]||0;}
function scIsReady(){return _scReady.some(Boolean);}

/* ══ MUSIC PLAYER ══ */
function MusicPlayer(){
  const [playing,setPlaying]=useState(false),[trackIdx,setTrackIdx]=useState(0),[vol,setVol]=useState(.7),[progress,setProgress]=useState(0),[ready,setReady]=useState(false);
  useEffect(()=>{
    initSC();
    const iv=setInterval(()=>{if(scIsReady()){setReady(true);clearInterval(iv);}},350);
    return()=>clearInterval(iv);
  },[]);
  useEffect(()=>{
    if(!playing)return;
    const iv=setInterval(()=>setProgress(scGetProgress()),200);
    return()=>clearInterval(iv);
  },[playing,trackIdx]);
  const toggle=()=>{
    if(!ready)return;
    if(playing){scPause();setPlaying(false);}
    else{try{getCtx().resume();}catch{}scPlay(trackIdx);setPlaying(true);}
  };
  const stop=()=>{scStop();setPlaying(false);setProgress(0);};
  const changeTrack=i=>{setTrackIdx(i);setProgress(0);if(playing)scPlay(i);};
  const handleSeek=e=>{
    if(!ready)return;
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const rect=e.currentTarget.getBoundingClientRect();
    const frac=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    scSeek(frac);setProgress(frac);
  };
  const tr=SC_TRACKS[trackIdx];
  const dur=scGetDuration(trackIdx);
  const fmtMs=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  return html`<div class="glass rounded-2xl overflow-hidden slide-up" style=${{background:'linear-gradient(145deg,'+tr.color+'1a,rgba(255,255,255,0.07))'}}>
    <div class="flex items-center gap-3 px-4 pt-4 pb-2">
      <span class="text-3xl">${tr.emoji}</span>
      <div class="flex-1 min-w-0">
        <div class="text-white font-black text-sm leading-tight truncate">${tr.name}</div>
        <div class="text-white/35 text-xs mt-0.5">🇮🇱 מוזיקה ישראלית</div>
      </div>
      <div class="flex items-end gap-0.5 flex-shrink-0" style=${{height:'18px'}}>
        ${playing
          ? [0,1,2,3].map(i=>html`<div key=${i} class="sbar" style=${{background:tr.color,animationDelay:(i*.12)+'s',height:'16px'}}/>`)
          : html`<div style=${{width:'14px'}}/>` }
      </div>
    </div>
    <div class="px-4 pb-1">
      <div class="h-3 rounded-full overflow-hidden cursor-pointer relative" style=${{background:'rgba(255,255,255,0.12)'}} onClick=${handleSeek} onTouchStart=${handleSeek}>
        <div class="h-full rounded-full" style=${{width:(progress*100)+'%',background:'linear-gradient(90deg,'+tr.color+','+tr.color+'cc)',transition:'width 0.2s linear'}}/>
        <div class="absolute w-3 h-3 rounded-full" style=${{left:'calc('+progress*100+'% - 6px)',top:'0',background:'#fff',boxShadow:'0 1px 4px rgba(0,0,0,.4)',opacity:(playing||progress>0)?1:0,transition:'left 0.2s linear'}}/>
      </div>
      <div class="flex justify-between mt-1" dir="ltr">
        <span class="text-white/30 text-xs">${dur>0?fmtMs(Math.round(progress*dur)):'0:00'}</span>
        <span class="text-white/30 text-xs">${dur>0?fmtMs(dur):'--:--'}</span>
      </div>
    </div>
    <div class="flex items-center gap-2 px-4 pb-3">
      <button onClick=${toggle} class=${'btn w-11 h-11 rounded-full flex items-center justify-center text-xl flex-shrink-0'+(ready?'':' opacity-40')} style=${playing?{background:'rgba(255,255,255,0.18)'}:{background:tr.color,boxShadow:'0 4px 14px '+tr.color+'88'}}>
        ${!ready?'⏳':playing?'⏸':'▶️'}
      </button>
      ${playing?html`<button onClick=${stop} class="btn glass w-9 h-9 rounded-full flex items-center justify-center text-white/60 font-bold flex-shrink-0" style=${{fontSize:'14px'}}>■</button>`:null}
      <div class="flex-1"/>
      <span class="text-white/30 text-xs">🔈</span>
      <input type="range" min="0" max="1" step="0.05" value=${vol} onInput=${e=>{const v=parseFloat(e.target.value);setVol(v);scSetVol(v);}} class="w-20" style=${{background:'linear-gradient(to right,'+tr.color+' '+(vol*100)+'%,rgba(255,255,255,0.2) '+(vol*100)+'%)'}}/>
      <span class="text-white/30 text-xs">🔊</span>
    </div>
    <div style=${{borderTop:'1px solid rgba(255,255,255,0.08)',maxHeight:'210px',overflowY:'auto',scrollbarWidth:'none'}}>
      ${SC_TRACKS.map((t,i)=>html`<button key=${i} onClick=${()=>changeTrack(i)} class="btn w-full flex items-center gap-2.5 px-4 py-2.5 text-right" style=${trackIdx===i?{background:'rgba(255,255,255,0.09)',borderRight:'3px solid '+t.color}:{borderRight:'3px solid transparent'}}>
        <span class="text-base flex-shrink-0" style=${{opacity:trackIdx===i?1:0.55}}>${t.emoji}</span>
        <span class=${'flex-1 text-xs font-bold truncate text-right'} style=${trackIdx===i?{color:t.color}:{color:'rgba(255,255,255,0.55)'}}>${t.name}</span>
        ${trackIdx===i&&playing?html`<div class="flex items-end gap-0.5 flex-shrink-0" style=${{height:'12px'}}>
          ${[0,1,2].map(j=>html`<div key=${j} class="sbar" style=${{background:t.color,height:'10px',animationDelay:(j*.14)+'s'}}/>`) }
        </div>`:html`<div style=${{width:'14px'}}/>` }
      </button>`)}
    </div>
  </div>`;
}

/* ══ MINI RING ══ */
function MiniRing({remaining,total,size=60}){
  const R=size/2-5,C=2*Math.PI*R,pct=total>0?Math.max(0,remaining/total):0,offset=C*(1-pct);
  const color=pct>.5?'#3b82f6':pct>.22?'#f97316':'#ef4444';
  return html`<svg width=${size} height=${size} style=${{transform:'rotate(-90deg)',flexShrink:0}}>
    <circle cx=${size/2} cy=${size/2} r=${R} fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
    <circle cx=${size/2} cy=${size/2} r=${R} fill="none" stroke=${color} stroke-width="5" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${offset} class="ring-arc"/>
  </svg>`;
}

  const selDon=avail.find(d=>d.id===doneness)||avail[0];
  const sideMin=meat.times[doneness]?calcSideTime(meat,doneness,thickness,fire):null;
  const previewBg={rare:'radial-gradient(ellipse at 45% 40%,#b91c1c,#7f1d1d,#450a0a)',medium:'radial-gradient(ellipse at 45% 40%,#d97706,#92400e,#451a03)',wellDone:'radial-gradient(ellipse at 45% 40%,#57534e,#292524,#0c0a09)'}[doneness];
  const SelRow=({options,value,onChange,label})=>html`<div class="mb-4">
    <div class="text-white/60 text-xs font-bold mb-2 uppercase tracking-wider">${label}</div>
    <div class="glass rounded-xl p-1 flex gap-1">
      ${options.map(opt=>html`<button key=${opt.id} onClick=${()=>onChange(opt.id)} class="sel-btn flex-1 py-2 px-1 rounded-lg text-center text-xs font-bold ${value===opt.id?'text-white':'text-white/38'}" style=${value===opt.id?{background:selDon.color,boxShadow:`0 2px 10px ${selDon.color}88`}:{}}>
        <div>${opt.label}</div><div class="font-normal opacity-75 mt-0.5 text-xs">${opt.sub}</div>
      </button>`)}
    </div>
  </div>`;
  return html`<div class="min-h-screen p-4 max-w-md mx-auto flex flex-col slide-left">
    <button onClick=${onBack} class="btn text-white/55 text-sm flex items-center gap-1 mt-4 mb-4">← ${meat.name}</button>
    <div class="glass rounded-2xl p-5 text-center mb-5 transition-all duration-500" style=${{background:previewBg}}>
      <div class="text-6xl mb-2 transition-all duration-500" style=${{filter:doneness==='wellDone'?'brightness(0.55) saturate(0.25)':'none'}}>${meat.emoji}</div>
      ${sideMin?html`<div>
        <div class="text-white font-bold">${selDon.sub}</div>
        <div class="text-white/60 text-sm mt-1"><span class="font-black text-white text-lg">${sideMin.toFixed(1)}'</span> לכל צד · <span class="font-black text-white">${(sideMin*2).toFixed(1)}'</span> סה"כ</div>
      </div>`:html`<div class="text-orange-300 font-bold text-sm">⚠️ לא מומלץ מבחינת בטיחות מזון</div>`}
    </div>
    <${SelRow} options=${avail}      value=${doneness}  onChange=${setDoneness}  label="מידת עשייה"/>
    <${SelRow} options=${THICKNESS}  value=${thickness} onChange=${setThickness} label="עובי הנתח"/>
    <${SelRow} options=${FIRE}       value=${fire}      onChange=${setFire}      label="עוצמת האש"/>
    <div class="glass rounded-xl p-3 mb-5 flex gap-3 items-start">
      <span class="text-xl flex-shrink-0">👨‍🍳</span>
      <div class="text-white/50 text-sm leading-relaxed">${meat.tip}</div>
    </div>
    <button disabled=${!sideMin} onClick=${()=>{if(sideMin){playSelectSound();onStart(meat,doneness,thickness,fire,sideMin);}}} class="btn py-5 rounded-2xl font-black text-xl text-white mt-auto" style=${sideMin?{background:'linear-gradient(135deg,#FF4500,#ff7700)',boxShadow:'0 8px 28px rgba(255,69,0,0.42)'}:{background:'#555',opacity:.45}}>
      ${sideMin?`🔥 הצת! (${(sideMin*2).toFixed(1)} דק')`:'🚫 לא זמין'}
    </button>
  </div>`;
}

/* ══ APP ══ */
function App(){
  const [screen,setScreen]=useState('home');
  const [activeTimers,setActiveTimers]=useState([]);
  const [pendingMeat,setPendingMeat]=useState(null);
  const [showMusic,setShowMusic]=useState(false);
  const [celebration,setCelebration]=useState(null);
  const flipTriggered=useRef(new Set());
  const doneTriggered=useRef(new Set());

  // Restore
  useEffect(()=>{
    const s=loadLS();if(!s||!s.timers)return;
    const restored=s.timers.map(t=>{
      const elapsed=(Date.now()-t.sideStartMs)/1000,rem=Math.max(0,t.totalSecs-elapsed);
      if(t.phase==='flipReady')return{...t,remaining:0};
      if(t.phase==='second'&&rem<=0)return{...t,remaining:0,phase:'done'};
      return{...t,remaining:rem};
    });
    setActiveTimers(restored);
    restored.forEach(t=>{if(t.phase==='flipReady'||t.phase==='second'||t.phase==='done')flipTriggered.current.add(t.id);if(t.phase==='done')doneTriggered.current.add(t.id);});
  },[]);

  // Master tick
  useEffect(()=>{
    const iv=setInterval(()=>{
      setActiveTimers(prev=>{
        let changed=false;
        const next=prev.map(t=>{
          if(t.phase==='done'||t.phase==='flipReady')return t;
          const elapsed=(Date.now()-t.sideStartMs)/1000,rem=Math.max(0,t.totalSecs-elapsed);
          if(rem<=0&&t.phase==='first'&&!flipTriggered.current.has(t.id)){flipTriggered.current.add(t.id);playFlipSound();vibe([500,150,500]);changed=true;return{...t,remaining:0,phase:'flipReady'};}
          if(rem<=0&&t.phase==='second'&&!doneTriggered.current.has(t.id)){doneTriggered.current.add(t.id);changed=true;return{...t,remaining:0,phase:'done'};}
          if(Math.abs((t.remaining??0)-rem)>.08)changed=true;
          return{...t,remaining:rem};
        });
        if(changed)saveLS({timers:next.map(({remaining:_,...r})=>r)});
        return changed?next:prev;
      });
    },220);
    return()=>clearInterval(iv);
  },[]);

  const handleStart=(meat,don,th,fi,sideMin)=>{
    const totalSecs=sideMin*60,now=Date.now();
    const t={id:uid(),meatId:meat.id,doneness:don,thickness:th,fire:fi,phase:'first',sideStartMs:now,totalSecs,remaining:totalSecs};
    setActiveTimers(prev=>{const next=[...prev,t];saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
    setScreen('home');
  };
  const handleFlip=id=>{
    const now=Date.now();flipTriggered.current.delete(id);
    setActiveTimers(prev=>{const next=prev.map(t=>t.id===id?{...t,phase:'second',sideStartMs:now,remaining:t.totalSecs}:t);saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
  };
  const handleRemove=id=>{
    flipTriggered.current.delete(id);doneTriggered.current.delete(id);
    setActiveTimers(prev=>{const next=prev.filter(t=>t.id!==id);saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
  };
  const handleCelebrate=timer=>{setCelebration(timer);handleRemove(timer.id);};

  return html`<div>
    <div id="sc-players" style=${{position:'fixed',top:'-9999px',left:'-9999px',width:'10px',height:'10px',overflow:'hidden',opacity:0,pointerEvents:'none'}}></div>
    <${FestiveBG}/>
    <div class="relative z-10">
      ${screen==='home'?html`<${HomeScreen} timers=${activeTimers} onAdd=${()=>setScreen('addMeat')} onFlip=${handleFlip} onRemove=${handleRemove} onCelebrate=${handleCelebrate} showMusic=${showMusic} onToggleMusic=${()=>setShowMusic(p=>!p)}/>`:null}
      ${screen==='addMeat'?html`<${MeatScreen} onSelect=${m=>{setPendingMeat(m);setScreen('configure');}} onBack=${()=>setScreen('home')}/>`:null}
      ${screen==='configure'&&pendingMeat?html`<${ConfigScreen} meat=${pendingMeat} onBack=${()=>setScreen('addMeat')} onStart=${handleStart}/>`:null}
    </div>
    ${celebration?html`<${Celebration} timer=${celebration} onClose=${()=>setCelebration(null)}/>`:null}
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
