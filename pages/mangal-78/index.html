   notes:[[392,.75],[0,.25],[330,.5],[294,.5],[330,.5],[392,.5],[440,.5],[494,2],[0,.5],[494,.75],[0,.25],[392,.5],[370,.5],[392,.5],[440,.5],[392,2],[0,.5],[392,.5],[392,.5],[523,.5],[494,.5],[440,.5],[392,.5],[330,.5],[294,2],[0,.5],[294,.5],[294,.5],[392,.5],[370,.5],[330,.5],[294,.5],[440,2],[0,1]]},
  {name:'על כל אלה – Beat', emoji:'🌿', color:'#047857', bpm:108, vol:.10,
   notes:[[294,.5],[392,1],[440,.5],[466,.5],[523,1],[587,2],[523,.5],[494,.5],[440,.5],[392,.5],[330,2],[0,.5],[294,.5],[392,1],[440,.5],[466,.5],[523,.5],[587,.5],[698,.5],[659,.5],[587,.5],[523,2],[0,1]]},
  {name:'ריקוד עם ישראל 🔥', emoji:'💃', color:'#b91c1c', bpm:145, vol:.10,

/* ══ UTILS ══ */
const fmt    = s  => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

const vibe   = p  => { if('vibrate' in navigator) try{navigator.vibrate(p)}catch{} };
const calcSideTime = (meat,don,th,fi) => (meat.times[don]??4) * (THICKNESS.find(t=>t.id===th)?.mult??1) * (FIRE.find(f=>f.id===fi)?.mult??1);

/* ══ AUDIO ══ */
let _ctx=null,_mg=null,_rev=null,_musicOn=false,_musicTrack=0,_musicTimer=null,_loopStartMs=null,_loopDurMs=0;
const getCtx=()=>{if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();return _ctx;};
const getMG=()=>{if(!_mg){const c=getCtx();_mg=c.createGain();_mg.gain.value=.55;_mg.connect(c.destination);}return _mg;};
const getRev=()=>{
  if(!_rev){const c=getCtx(),len=Math.round(c.sampleRate*1.3),buf=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
    const conv=c.createConvolver();conv.buffer=buf;
    const g=c.createGain();g.gain.value=.16;conv.connect(g);g.connect(getMG());_rev=conv;}
  return _rev;};
function tone(freq,start,dur,vol=.18,type='triangle',master=false){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(master?getMG():c.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.start(start);o.stop(start+dur+.02);}catch{}
}
function richNote(freq,start,dur,vol){
  try{const c=getCtx();
    [0,5,-5].forEach((det,i)=>{
      const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
      f.type='lowpass';f.frequency.setValueAtTime(800,start);f.frequency.linearRampToValueAtTime(3400,start+.07);
      o.type='sawtooth';o.detune.value=det;o.frequency.value=freq;
      const v=i===0?vol:vol*.32;
      g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(v,start+.014);
      g.gain.setValueAtTime(v*.82,start+dur*.62);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
      o.connect(f);f.connect(g);g.connect(getMG());
      if(i===0)g.connect(getRev());
      o.start(start);o.stop(start+dur+.05);
    });
  }catch{}
}
function bassNote(freq,start,dur,vol){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    f.type='lowpass';f.frequency.value=380;o.type='square';o.frequency.value=freq/2;
    g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.01);
    g.gain.setValueAtTime(vol*.72,start+dur*.5);g.gain.exponentialRampToValueAtTime(.0001,start+dur*.82);
    o.connect(f);f.connect(g);g.connect(getMG());o.start(start);o.stop(start+dur+.04);
  }catch{}
}
function drumKick(t){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(28,t+.19);
    g.gain.setValueAtTime(.92,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.connect(g);g.connect(getMG());o.start(t);o.stop(t+.3);
  }catch{}
}
function drumSnare(t){
  try{const c=getCtx(),dur=.13;
    const buf=c.createBuffer(1,Math.round(c.sampleRate*dur),c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=.85;
    const g=c.createGain();g.gain.setValueAtTime(.38,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    const o=c.createOscillator(),og=c.createGain();o.frequency.value=210;
    og.gain.setValueAtTime(.22,t);og.gain.exponentialRampToValueAtTime(.001,t+.055);
    src.connect(bp);bp.connect(g);g.connect(getMG());o.connect(og);og.connect(getMG());
    src.start(t);src.stop(t+dur+.01);o.start(t);o.stop(t+.07);
  }catch{}
}
function drumHihat(t){
  try{const c=getCtx(),dur=.044;
    const buf=c.createBuffer(1,Math.round(c.sampleRate*.08),c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=9200;
    const g=c.createGain();g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(hp);hp.connect(g);g.connect(getMG());src.start(t);src.stop(t+dur+.01);
  }catch{}
}
function playSizzle(){
  try{const c=getCtx(),dur=1.1,buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=c.createBufferSource();src.buffer=buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.7;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;const g=c.createGain(),t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.52,t+.03);g.gain.setValueAtTime(.42,t+.09);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur);}catch{}
}
function playFlipSound(){try{const c=getCtx(),t=c.currentTime;[880,1100,880,1100,1320].forEach((f,i)=>tone(f,t+i*.14,.22,.17,'sine'));}catch{}}
function playCelebSound(){try{const c=getCtx(),t=c.currentTime;[523,587,659,698,784,880,784,698,659,784,1047].forEach((f,i)=>tone(f,t+i*.16,.2,.14,'triangle'));}catch{}}
function playSelectSound(){try{const c=getCtx(),t=c.currentTime;tone(440,t,.1,.12,'sine');tone(550,t+.08,.12,.1,'sine');}catch{}}
function scheduleTrack(idx){
  const tr=TRACKS[idx],beat=60/tr.bpm,c=getCtx();
  let t=c.currentTime+.05,elapsed=0;
  tr.notes.forEach(([f,b])=>{
    const dur=b*beat,pos=elapsed%4;
    if(Math.abs(pos)<.08||Math.abs(pos-2)<.08) drumKick(t);
    if(Math.abs(pos-1)<.08||Math.abs(pos-3)<.08) drumSnare(t);
    if(b<=.5) drumHihat(t);
    if(f>0){
      richNote(f,t,dur*.87,tr.vol);
      if(Math.abs(pos)<.08||Math.abs(pos-2)<.08) bassNote(f,t,Math.min(dur*.9,beat*.88),tr.vol*.78);
    }
    t+=dur;elapsed+=b;
  });
  const dur=tr.notes.reduce((s,[,b])=>s+b,0)*beat;
  _loopStartMs=Date.now()+50;_loopDurMs=dur*1000;
  if(_musicTimer)clearTimeout(_musicTimer);
  _musicTimer=setTimeout(()=>{if(_musicOn)scheduleTrack(_musicTrack);},dur*1000+120);
}
function startTrack(i){_musicOn=true;_musicTrack=i;scheduleTrack(i);}
function stopTrack(){_musicOn=false;if(_musicTimer){clearTimeout(_musicTimer);_musicTimer=null;}}
function setMusicVol(v){getMG().gain.value=v;}
function getMusicProgress(){if(!_musicOn||!_loopStartMs)return 0;return((Date.now()-_loopStartMs)%_loopDurMs)/_loopDurMs;}

/* ══ BACKGROUND ══ */
const BG_STARS = Array.from({length:24},(_,i)=>({id:i,x:(i*17+5)%94,y:(i*29+7)%88,size:12+(i%5)*10,depth:.2+(i%4)*.28,dur:`${5.5+i*1.1}s`,delay:`${(i*.55)%4.5}s`,op:.055+(i%4)*.022,dark:i%3===0}));
function FestiveBG(){
  const [mx,setMx]=useState(0),[my,setMy]=useState(0);
  const mobile=useMemo(()=>window.matchMedia('(max-width:768px)').matches,[]);
  useEffect(()=>{
    if(mobile)return;
    const h=e=>{setMx((e.clientX/window.innerWidth-.5)*2);setMy((e.clientY/window.innerHeight-.5)*2);};
    window.addEventListener('mousemove',h,{passive:true});
    return()=>window.removeEventListener('mousemove',h);
  },[mobile]);
  return html`<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
    ${BG_STARS.map(s=>{const px=mobile?0:mx*s.depth*22,py=mobile?0:my*s.depth*16;return html`<div key=${s.id} class="star-bg absolute" style=${{left:`${s.x}%`,top:`${s.y}%`,fontSize:s.size,color:`rgba(${s.dark?'0,20,100':'0,40,160'},${s.op})`,transform:`translate(${px}px,${py}px)`,transition:mobile?'none':'transform 0.5s ease-out','--dur':s.dur,'--delay':s.delay}}>✡</div>`;})}
  </div>`;
}

}

/* ══ MUSIC PLAYER ══ */
function MusicPlayer(){
  const [playing,setPlaying]=useState(false),[trackIdx,setTrackIdx]=useState(0),[vol,setVol]=useState(.55),[progress,setProgress]=useState(0);
  useEffect(()=>{if(!playing)return;const iv=setInterval(()=>setProgress(getMusicProgress()),120);return()=>clearInterval(iv);},[playing,trackIdx]);
  const toggle=()=>{try{getCtx().resume();}catch{}if(playing){stopTrack();setPlaying(false);setProgress(0);}else{startTrack(trackIdx);setPlaying(true);}};
  const changeTrack=i=>{setTrackIdx(i);if(playing){stopTrack();setTimeout(()=>startTrack(i),60);}};
  const tr=TRACKS[trackIdx];
  return html`<div class="glass rounded-2xl p-3 slide-up">
    <div class="flex gap-1.5 mb-2.5 overflow-x-auto pb-0.5" style=${{scrollbarWidth:'none'}}>
      ${TRACKS.map((t,i)=>html`<button key=${i} onClick=${()=>changeTrack(i)} class="btn flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap" style=${trackIdx===i?{background:t.color,color:'#fff'}:{color:'rgba(255,255,255,0.4)'}}>${t.emoji} ${t.name}</button>`)}
    </div>
    <div class="flex items-center gap-2.5">
      <button onClick=${toggle} class="btn text-2xl flex-shrink-0 w-9 h-9 flex items-center justify-center">${playing?'⏸':'▶️'}</button>
      <div class="flex-1 min-w-0" dir="ltr">
        <div class="h-2 rounded-full overflow-hidden" style=${{background:'rgba(255,255,255,0.15)'}}>
          <div class="h-full rounded-full transition-all duration-100" style=${{width:`${progress*100}%`,background:tr.color}}/>
        </div>
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0" dir="ltr">
        <span class="text-white/40 text-xs">🔈</span>
        <input type="range" min="0" max="1" step="0.05" value=${vol} onInput=${e=>{const v=parseFloat(e.target.value);setVol(v);setMusicVol(v);}} class="w-16" style=${{background:`linear-gradient(to right,${tr.color} ${vol*100}%,rgba(255,255,255,0.2) ${vol*100}%)`}}/>
        <span class="text-white/40 text-xs">🔊</span>
      </div>
    </div>
  </div>`;
}

/* ══ MINI RING ══ */
function MiniRing({remaining,total,size=60}){
  const R=size/2-5,C=2*Math.PI*R,pct=total>0?Math.max(0,remaining/total):0,offset=C*(1-pct);
  const color=pct>.5?'#3b82f6':pct>.22?'#f97316':'#ef4444';
  return html`<svg width=${size} height=${size} style=${{transform:'rotate(-90deg)',flexShrink:0}}>
    <circle cx=${size/2} cy=${size/2} r=${R} fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
    <circle cx=${size/2} cy=${size/2} r=${R} fill="none" stroke=${color} stroke-width="5" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${offset} class="ring-arc"/>
  </svg>`;
}

/* ══ TIMER CARD ══ */
function TimerCard({timer,onFlip,onRemove,onCelebrate}){
  const meat=MEATS.find(m=>m.id===timer.meatId);if(!meat)return null;
  const thick=THICKNESS.find(t=>t.id===timer.thickness),fire=FIRE.find(f=>f.id===timer.fire);
  const meatBg={rare:'radial-gradient(ellipse at 45% 40%,#b91c1c,#7f1d1d,#450a0a)',medium:'radial-gradient(ellipse at 45% 40%,#d97706,#92400e,#451a03)',wellDone:'radial-gradient(ellipse at 45% 40%,#57534e,#292524,#0c0a09)'}[timer.doneness];
  const isDone=timer.phase==='done',isFlip=timer.phase==='flipReady',isSecond=timer.phase==='second';
  const phaseLabel=isFlip?'⚡ הפוך עכשיו!':isDone?'✅ מוכן!':isSecond?'🔥 צד שני':'🔥 צד ראשון';
  return html`<div class=${`timer-card glass rounded-2xl overflow-hidden relative ${isFlip?'flip-pulse':''} ${isDone?'done-pulse glass-green':''}`}>
    <div class="flex items-center gap-3 p-3">
      <div class="relative flex-shrink-0">
        <div class="meat-img w-16 h-16 rounded-xl" style=${{background:meat.img||meatBg,transition:'filter 0.5s',filter:isDone?'brightness(1.15)':'none'}}>
          <div class="meat-emoji h-full flex items-center justify-center text-3xl">${meat.emoji}</div>
        </div>
        ${!isDone?html`<div class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white/20" style=${{background:isFlip?'#FF4500':isSecond?'#22c55e':'#3b82f6'}}/>`:null}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-white font-black text-sm leading-tight truncate">${meat.name}</div>
        <div class="text-white/55 text-xs mt-0.5 truncate">${D_LABEL[timer.doneness]} · ${thick?.label} · ${fire?.icon}</div>
        <div class=${`text-xs font-bold mt-0.5 ${isFlip?'text-orange-300':isDone?'text-green-300':'text-blue-200'}`}>${phaseLabel}</div>
      </div>
      <div class="flex flex-col items-center gap-0.5 flex-shrink-0">
        <${MiniRing} remaining=${timer.remaining??0} total=${timer.totalSecs} size=${56}/>
        <div class="text-white font-black text-xs" style=${{marginTop:-2}}>${isDone?'🎉':fmt(Math.ceil(timer.remaining??0))}</div>
      </div>
    </div>
    ${(isFlip||isDone)?html`<div class="px-3 pb-3 flex gap-2">
      ${isFlip?html`<button onClick=${()=>onFlip(timer.id)} class="btn flex-1 py-2.5 rounded-xl font-black text-white text-sm" style=${{background:'linear-gradient(135deg,#FF4500,#ff7700)'}}>הפכתי! 🔄</button>`:null}
      ${isDone?html`<button onClick=${()=>onCelebrate(timer)} class="btn flex-1 py-2.5 rounded-xl font-black text-white text-sm" style=${{background:'linear-gradient(135deg,#16a34a,#22c55e)'}}>🎉 חגוג!</button>`:null}
      <button onClick=${()=>onRemove(timer.id)} class="btn glass px-4 py-2.5 rounded-xl text-white/60 text-sm font-bold">✕</button>
    </div>`:html`<button onClick=${()=>onRemove(timer.id)} class="absolute top-2 left-2 btn glass w-6 h-6 rounded-full flex items-center justify-center text-white/30 text-xs">✕</button>`}
  </div>`;
}

/* ══ CELEBRATION ══ */
function Celebration({timer,onClose}){
  const meat=MEATS.find(m=>m.id===timer.meatId);
  const canvasRef=useRef(null);
  useEffect(()=>{
    playCelebSound();vibe([300,120,300,120,600]);
    const el=canvasRef.current;if(!el||!window.confetti)return;
    const fire=confetti.create(el,{resize:true,useWorker:false});
    const colors=['#0038B8','#FFFFFF','#1e40af','#93c5fd','#eff6ff'];
    const shoot=x=>fire({particleCount:70,spread:88,origin:{x,y:.65},colors,gravity:.88});
    shoot(.25);shoot(.75);
    const t1=setTimeout(()=>{shoot(.2);shoot(.8);},430);
    const t2=setTimeout(()=>{shoot(.5);},870);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);
  return html`<div class="fixed inset-0 z-50 flex items-center justify-center" style=${{background:'rgba(0,12,60,0.93)'}}>
    <canvas ref=${canvasRef} class="fixed inset-0 w-full h-full pointer-events-none"/>
    <div class="glass rounded-3xl p-8 text-center mx-5 max-w-xs w-full relative z-10 slide-up">
      <div class="text-6xl mb-3">🎉</div>
      <div class="text-4xl font-black text-white mb-2">מוכן!</div>
      <div class="text-xl font-bold text-blue-200 mb-1">${meat?.name}</div>
      <div class="text-white/55 text-sm mb-3">${D_LABEL[timer.doneness]}</div>
      <div class="text-4xl my-4">🇮🇱</div>
      <div class="text-white/65 text-sm mb-6">חג עצמאות שמח! בתיאבון 🥩🔥</div>

    </div>
  </div>`;
}

/* ══ CONFIG SCREEN ══ */
function ConfigScreen({meat,onBack,onStart}){
  const [doneness,setDoneness]=useState('medium'),[thickness,setThickness]=useState('normal'),[fire,setFire]=useState('medium');
  const avail=DONENESS.filter(d=>!(meat.id==='burger'&&d.id==='rare'));
  const selDon=avail.find(d=>d.id===doneness)||avail[0];
  const sideMin=meat.times[doneness]?calcSideTime(meat,doneness,thickness,fire):null;
  const previewBg={rare:'radial-gradient(ellipse at 45% 40%,#b91c1c,#7f1d1d,#450a0a)',medium:'radial-gradient(ellipse at 45% 40%,#d97706,#92400e,#451a03)',wellDone:'radial-gradient(ellipse at 45% 40%,#57534e,#292524,#0c0a09)'}[doneness];

  return html`<div class="min-h-screen p-4 max-w-md mx-auto flex flex-col slide-left">
    <button onClick=${onBack} class="btn text-white/55 text-sm flex items-center gap-1 mt-4 mb-4">← ${meat.name}</button>
    <div class="glass rounded-2xl p-5 text-center mb-5 transition-all duration-500" style=${{background:previewBg}}>
      <div class="text-6xl mb-2 transition-all duration-500" style=${{filter:doneness==='wellDone'?'brightness(0.55) saturate(0.25)':'none'}}>${meat.emoji}</div>

}

/* ══ APP ══ */
function App(){
  const [screen,setScreen]=useState('home');
  const [activeTimers,setActiveTimers]=useState([]);
  const [pendingMeat,setPendingMeat]=useState(null);
  const [showMusic,setShowMusic]=useState(false);
  const [celebration,setCelebration]=useState(null);
  const flipTriggered=useRef(new Set());
  const doneTriggered=useRef(new Set());

  // Restore
  useEffect(()=>{
    const s=loadLS();if(!s||!s.timers)return;
    const restored=s.timers.map(t=>{
      const elapsed=(Date.now()-t.sideStartMs)/1000,rem=Math.max(0,t.totalSecs-elapsed);
      if(t.phase==='flipReady')return{...t,remaining:0};
      if(t.phase==='second'&&rem<=0)return{...t,remaining:0,phase:'done'};
      return{...t,remaining:rem};
    });
    setActiveTimers(restored);
    restored.forEach(t=>{if(t.phase==='flipReady'||t.phase==='second'||t.phase==='done')flipTriggered.current.add(t.id);if(t.phase==='done')doneTriggered.current.add(t.id);});
  },[]);

  // Master tick
  useEffect(()=>{
    const iv=setInterval(()=>{
      setActiveTimers(prev=>{
        let changed=false;
        const next=prev.map(t=>{
          if(t.phase==='done'||t.phase==='flipReady')return t;
          const elapsed=(Date.now()-t.sideStartMs)/1000,rem=Math.max(0,t.totalSecs-elapsed);
          if(rem<=0&&t.phase==='first'&&!flipTriggered.current.has(t.id)){flipTriggered.current.add(t.id);playFlipSound();vibe([500,150,500]);changed=true;return{...t,remaining:0,phase:'flipReady'};}
          if(rem<=0&&t.phase==='second'&&!doneTriggered.current.has(t.id)){doneTriggered.current.add(t.id);changed=true;return{...t,remaining:0,phase:'done'};}
          if(Math.abs((t.remaining??0)-rem)>.08)changed=true;
          return{...t,remaining:rem};
        });
        if(changed)saveLS({timers:next.map(({remaining:_,...r})=>r)});
        return changed?next:prev;
      });
    },220);
    return()=>clearInterval(iv);
  },[]);

  const handleStart=(meat,don,th,fi,sideMin)=>{
    const totalSecs=sideMin*60,now=Date.now();
    const t={id:uid(),meatId:meat.id,doneness:don,thickness:th,fire:fi,phase:'first',sideStartMs:now,totalSecs,remaining:totalSecs};
    setActiveTimers(prev=>{const next=[...prev,t];saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
    setScreen('home');
  };
  const handleFlip=id=>{
    const now=Date.now();flipTriggered.current.delete(id);
    setActiveTimers(prev=>{const next=prev.map(t=>t.id===id?{...t,phase:'second',sideStartMs:now,remaining:t.totalSecs}:t);saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
  };
  const handleRemove=id=>{
    flipTriggered.current.delete(id);doneTriggered.current.delete(id);
    setActiveTimers(prev=>{const next=prev.filter(t=>t.id!==id);saveLS({timers:next.map(({remaining:_,...r})=>r)});return next;});
  };
  const handleCelebrate=timer=>{setCelebration(timer);handleRemove(timer.id);};
  const handleQuickAdd=meat=>{playSelectSound();setPendingMeat(meat);setScreen('configure');};

  return html`<div>
    <${FestiveBG}/>
    <div class="relative z-10">
      ${screen==='home'?html`<${HomeScreen} timers=${activeTimers} onFlip=${handleFlip} onRemove=${handleRemove} onCelebrate=${handleCelebrate} showMusic=${showMusic} onToggleMusic=${()=>setShowMusic(p=>!p)} onQuickAdd=${handleQuickAdd}/>`:null}
      ${screen==='addMeat'?html`<${MeatScreen} onSelect=${m=>{setPendingMeat(m);setScreen('configure');}} onBack=${()=>setScreen('home')}/>`:null}
      ${screen==='configure'&&pendingMeat?html`<${ConfigScreen} meat=${pendingMeat} onBack=${()=>setScreen('home')} onStart=${handleStart}/>`:null}
    </div>
    ${celebration?html`<${Celebration} timer=${celebration} onClose=${()=>setCelebration(null)}/>`:null}
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
